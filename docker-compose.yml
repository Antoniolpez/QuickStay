# ============================================================================
# QUICKSTAY INFRASTRUCTURE - DOCKER COMPOSE MASTER
# ============================================================================
# Despliegue completo de la infraestructura QuickStay con segmentación VLAN
# Autor: Antonio López Montes
# Fecha: Enero 2026
# ============================================================================

networks:
  # VLAN 10 - DMZ (Zona Desmilitarizada - Servidores Web)
  dmz_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.10.0/24
          gateway: 172.16.10.1

  # VLAN 20 - Servicios (Aplicación y Base de Datos)
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.20.0/24
          gateway: 172.16.20.1

  # VLAN 30 - Gestión (AD-DC, Zabbix, Wazuh)
  mgmt_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.30.0/24
          gateway: 172.16.30.1

  # VLAN 40 - IoT/OT (MQTT y dispositivos IoT)
  iot_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.40.0/23
          gateway: 172.16.40.1

  # VLAN 50 - VPN (Administración remota)
  vpn_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.50.0/26
          gateway: 172.16.50.1

services:
  # ==========================================================================
  # ROUTER/FIREWALL - Gateway Principal con nftables
  # ==========================================================================
  router-fw:
    build:
      context: ./infrastructure/docker/router-fw
      network: host
    container_name: quickstay-router-fw
    hostname: router-fw
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    privileged: true
    networks:
      dmz_net:
      app_net:
      mgmt_net:
      iot_net:
      vpn_net:
    ports:
      - "80:80"            # HTTP publico (edge del router)
      - "443:443"          # HTTPS publico (edge del router)
      - "51820:51820/udp"  # WireGuard via router (WG local en router-fw)

    env_file:
      - ./secrets.env
    environment:
      - ZABBIX_AGENT_ENABLE=0
      - ZABBIX_AGENT_METADATA=quickstay-router-fw
      - ZABBIX_AGENT_HOSTNAME=router-fw
    dns:
      - ${INFRA_DNS_PRIMARY:-172.16.30.10}
      - ${INFRA_DNS_SECONDARY:-172.16.30.11}
    dns_search:
      - quickstay.local
    volumes:
      - ./infrastructure/docker/router-fw/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./infrastructure/docker/router-fw/router_admin.py:/usr/local/bin/router_admin.py:ro
      - ./infrastructure/docker/router-fw/router_admin_templates:/usr/local/bin/router_admin_templates:ro
      - ./infrastructure/docker/router-fw/router_admin_static:/usr/local/bin/router_admin_static:ro
      - ./infrastructure/config/nftables:/etc/nftables
      - ./wireguard/config:/etc/wireguard
      - /lib/modules:/lib/modules:ro
      - ./logs/router:/var/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8443)); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ==========================================================================
  # LOAD BALANCER (HAProxy)
  # ==========================================================================
  load-balancer:
    build:
      context: .
      dockerfile: ./infrastructure/docker/haproxy/Dockerfile
      network: host
    container_name: quickstay-lb
    hostname: lb.quickstay.local
    networks:
      dmz_net:
        ipv4_address: 172.16.10.10
    expose:
      - "8404"  # Stats solo interno (sin publicar al host)
    env_file:
      - ./secrets.env
    environment:
      - ZABBIX_AGENT_ENABLE=1
      - ZABBIX_AGENT_SERVER=172.16.10.22,172.16.20.22,172.16.30.22,172.16.40.22
      - ZABBIX_AGENT_ACTIVE_SERVER=172.16.10.22
      - ZABBIX_AGENT_METADATA=quickstay-load-balancer
      - ZABBIX_AGENT_HOSTNAME=lb.quickstay.local
    dns:
      - ${INFRA_DNS_PRIMARY:-172.16.30.10}
      - ${INFRA_DNS_SECONDARY:-172.16.30.11}
    dns_search:
      - quickstay.local
    volumes:
      - ./infrastructure/config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./logs/haproxy:/var/log/haproxy
    depends_on:
      - web-server-1
      - web-server-2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================================================
  web-server-1:
    build:
      context: ./infrastructure/docker/web-server
      network: host
    container_name: quickstay-web-1
    hostname: web1.quickstay.local
    networks:
      dmz_net:
        ipv4_address: 172.16.10.20
    env_file:
      - ./secrets.env
    environment:
      - ZABBIX_AGENT_ENABLE=1
      - ZABBIX_AGENT_SERVER=172.16.10.22,172.16.20.22,172.16.30.22,172.16.40.22
      - ZABBIX_AGENT_ACTIVE_SERVER=172.16.10.22
      - ZABBIX_AGENT_METADATA=quickstay-web
      - ZABBIX_AGENT_HOSTNAME=web1.quickstay.local
    dns:
      - ${INFRA_DNS_PRIMARY:-172.16.30.10}
      - ${INFRA_DNS_SECONDARY:-172.16.30.11}
    dns_search:
      - quickstay.local
    volumes:
      - ./infrastructure/web-content:/var/www/html
      - ./logs/web1:/var/log/apache2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "apache2ctl -t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================================================
  # WEB SERVER 2 (Apache + PHP) - Redundancia
  # ==========================================================================
  web-server-2:
    build:
      context: ./infrastructure/docker/web-server
      network: host
    container_name: quickstay-web-2
    hostname: web2.quickstay.local
    networks:
      dmz_net:
        ipv4_address: 172.16.10.21
    env_file:
      - ./secrets.env
    environment:
      - ZABBIX_AGENT_ENABLE=1
      - ZABBIX_AGENT_SERVER=172.16.10.22,172.16.20.22,172.16.30.22,172.16.40.22
      - ZABBIX_AGENT_ACTIVE_SERVER=172.16.10.22
      - ZABBIX_AGENT_METADATA=quickstay-web
      - ZABBIX_AGENT_HOSTNAME=web2.quickstay.local
    dns:
      - ${INFRA_DNS_PRIMARY:-172.16.30.10}
      - ${INFRA_DNS_SECONDARY:-172.16.30.11}
    dns_search:
      - quickstay.local
    volumes:
      - ./infrastructure/web-content:/var/www/html
      - ./logs/web2:/var/log/apache2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "apache2ctl -t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================================================
  # APPLICATION SERVER (Java - Servidor QuickStay)
  # ==========================================================================
  app-server:
    build:
      context: ./Documentación/app_repo
      network: host
    container_name: quickstay-app
    hostname: app.quickstay.local
    networks:
      app_net:
        ipv4_address: 172.16.20.10
    env_file:
      - ./secrets.env
    environment:
      - JAVA_OPTS=-Xmx2g -Xms512m
      - ZABBIX_AGENT_ENABLE=1
      - ZABBIX_AGENT_SERVER=172.16.10.22,172.16.20.22,172.16.30.22,172.16.40.22
      - ZABBIX_AGENT_ACTIVE_SERVER=172.16.20.22
      - ZABBIX_AGENT_METADATA=quickstay-app
      - ZABBIX_AGENT_HOSTNAME=app.quickstay.local
    dns:
      - ${INFRA_DNS_PRIMARY:-172.16.30.10}
      - ${INFRA_DNS_SECONDARY:-172.16.30.11}
    dns_search:
      - quickstay.local
    volumes:
      - ./logs/app:/var/log/quickstay
    depends_on:
      - mysql-db
      - ad-dc-primary
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1234"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 50s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ==========================================================================
  # MYSQL DATABASE (Primary)
  # ==========================================================================
  mysql-db:
    build:
      context: ./infrastructure/docker/mysql
      network: host
    container_name: quickstay-mysql
    hostname: db.quickstay.local
    networks:
      app_net:
        ipv4_address: 172.16.20.20
    env_file:
      - ./secrets.env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - ZABBIX_AGENT_ENABLE=1
      - ZABBIX_AGENT_SERVER=172.16.10.22,172.16.20.22,172.16.30.22,172.16.40.22
      - ZABBIX_AGENT_ACTIVE_SERVER=172.16.20.22
      - ZABBIX_AGENT_METADATA=quickstay-mysql
      - ZABBIX_AGENT_HOSTNAME=db.quickstay.local
    dns:
      - ${INFRA_DNS_PRIMARY:-172.16.30.10}
      - ${INFRA_DNS_SECONDARY:-172.16.30.11}
    dns_search:
      - quickstay.local
    volumes:
      - mysql-data:/var/lib/mysql
      - ./Documentación/infrastructure/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./infrastructure/config/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./logs/mysql:/var/log/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 60s

  # ==========================================================================
  # ACTIVE DIRECTORY - Domain Controller Primary (Samba AD-DC)
  # ==========================================================================
  ad-dc-primary:
    build:
      context: ./infrastructure/docker/samba-ad-dc
      network: host
    container_name: quickstay-ad-dc1
    hostname: dc1.quickstay.local
    networks:
      mgmt_net:
        ipv4_address: 172.16.30.10
    env_file:
      - ./secrets.env
    environment:
      - DOMAIN=${AD_DOMAIN}
      - REALM=${AD_REALM}
      - ADMIN_PASSWORD=${AD_ADMIN_PASSWORD}
      - DNS_FORWARDER=${AD_DNS_FORWARDER}
      - ZABBIX_AGENT_ENABLE=1
      - ZABBIX_AGENT_SERVER=172.16.10.22,172.16.20.22,172.16.30.22,172.16.40.22
      - ZABBIX_AGENT_ACTIVE_SERVER=172.16.30.22
      - ZABBIX_AGENT_METADATA=quickstay-ad-dc
      - ZABBIX_AGENT_HOSTNAME=dc1.quickstay.local
    volumes:
      - ad-dc-data:/var/lib/samba
      - ad-dc-config:/etc/samba
      - ./logs/ad-dc:/var/log/samba
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    privileged: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "samba-tool domain level show >/dev/null 2>&1"]
      interval: 45s
      timeout: 10s
      retries: 4
      start_period: 90s

  # ==========================================================================
  # ZABBIX SERVER (Monitoring)
  # ==========================================================================
  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-6.4.21
    container_name: quickstay-zabbix
    hostname: zabbix.quickstay.local
    networks:
      dmz_net:
        ipv4_address: 172.16.10.22
      app_net:
        ipv4_address: 172.16.20.22
      mgmt_net:
        ipv4_address: 172.16.30.22
      iot_net:
        ipv4_address: 172.16.40.22
    env_file:
      - ./secrets.env
    environment:
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=${ZABBIX_DB_PASSWORD}
    volumes:
      - ./logs/zabbix:/var/log/zabbix
    depends_on:
      zabbix-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10051"]
      interval: 30s
      timeout: 8s
      retries: 6
      start_period: 60s

  # Base de datos para Zabbix
  zabbix-db:
    image: mysql:8.0
    container_name: quickstay-zabbix-db
    networks:
      mgmt_net:
        ipv4_address: 172.16.30.23
    environment:
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=${ZABBIX_DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - zabbix-db-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin --skip-log-bin --skip-name-resolve
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysqladmin ping -uroot -h 127.0.0.1 --silent"]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 45s

  # Frontend Web de Zabbix
  zabbix-web:
    image: zabbix/zabbix-web-apache-mysql:alpine-6.4.21
    container_name: quickstay-zabbix-web
    networks:
      mgmt_net:
        ipv4_address: 172.16.30.20
    environment:
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=${ZABBIX_DB_PASSWORD}
      - ZBX_SERVER_HOST=zabbix-server
      - PHP_TZ=${TZ}
    depends_on:
      zabbix-server:
        condition: service_healthy
      zabbix-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null"]
      interval: 30s
      timeout: 8s
      retries: 8
      start_period: 60s

  # ==========================================================================
  # WAZUH MANAGER (SIEM/Security)
  # ==========================================================================
  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.0
    container_name: quickstay-wazuh
    hostname: security.quickstay.local
    networks:
      mgmt_net:
        ipv4_address: 172.16.30.30
    env_file:
      - ./secrets.env
    environment:
      - INDEXER_URL=https://quickstay-wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_API_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=none
    volumes:
      - wazuh-api-config:/var/ossec/api/configuration
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - wazuh-var-multigroups:/var/ossec/var/multigroups
      - wazuh-integrations:/var/ossec/integrations
      - wazuh-active-response:/var/ossec/active-response/bin
      - wazuh-agentless:/var/ossec/agentless
      - wazuh-wodles:/var/ossec/wodles
      - ./logs/wazuh:/var/ossec/logs
    restart: unless-stopped

  # Wazuh Indexer (OpenSearch)
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.7.0
    container_name: quickstay-wazuh-indexer
    networks:
      mgmt_net:
        ipv4_address: 172.16.30.32
    env_file:
      - ./secrets.env
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
    restart: unless-stopped

  # Wazuh Dashboard (Kibana)
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7.0
    container_name: quickstay-wazuh-dashboard
    networks:
      mgmt_net:
        ipv4_address: 172.16.30.31
    env_file:
      - ./secrets.env
    environment:
      - INDEXER_URL=https://quickstay-wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_API_PASSWORD}
      - WAZUH_API_URL=https://quickstay-wazuh:55000
      - OPENSEARCH_HOSTS=["https://172.16.30.32:9200"]
      - API_USERNAME=${WAZUH_API_USERNAME}
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    links:
      - wazuh-indexer:wazuh.indexer
      - wazuh-manager:wazuh.manager
    restart: unless-stopped

  # ==========================================================================
  # MQTT BROKER (Mosquitto - IoT)
  # ==========================================================================
  mqtt-broker:
    build:
      context: ./infrastructure/docker/mqtt
      network: host
    container_name: quickstay-mqtt
    hostname: mqtt.quickstay.local
    networks:
      iot_net:
        ipv4_address: 172.16.40.10
    env_file:
      - ./secrets.env
    environment:
      - ZABBIX_AGENT_ENABLE=1
      - ZABBIX_AGENT_SERVER=172.16.10.22,172.16.20.22,172.16.30.22,172.16.40.22
      - ZABBIX_AGENT_ACTIVE_SERVER=172.16.40.22
      - ZABBIX_AGENT_METADATA=quickstay-mqtt
      - ZABBIX_AGENT_HOSTNAME=mqtt.quickstay.local
    dns:
      - ${INFRA_DNS_PRIMARY:-172.16.30.10}
      - ${INFRA_DNS_SECONDARY:-172.16.30.11}
    dns_search:
      - quickstay.local
    volumes:
      - ./infrastructure/config/mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
      - ./infrastructure/config/mosquitto/passwd:/etc/mosquitto/passwd:ro
      - mqtt-data:/var/lib/mosquitto
      - ./logs/mqtt:/var/log/mosquitto
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 30s
      timeout: 6s
      retries: 4
      start_period: 25s

  # ==========================================================================
  # IoT SIMULATOR (Python script)
  # ==========================================================================
  iot-simulator:
    build:
      context: ./Documentación/iot
      network: host
    container_name: quickstay-iot-simulator
    networks:
      iot_net:
    env_file:
      - ./secrets.env
    environment:
      - MQTT_BROKER=${MQTT_BROKER_HOST}
      - MQTT_PORT=${MQTT_BROKER_PORT}
    dns:
      - ${INFRA_DNS_PRIMARY:-172.16.30.10}
      - ${INFRA_DNS_SECONDARY:-172.16.30.11}
    dns_search:
      - quickstay.local
    depends_on:
      - mqtt-broker
    restart: unless-stopped

  # ==========================================================================
  # GRAFANA (Visualización de Métricas)
  # ==========================================================================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: quickstay-grafana
    networks:
      mgmt_net:
        ipv4_address: 172.16.30.21
    env_file:
      - ./secrets.env
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/config/grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped

  # ==========================================================================
  # DASHBOARD MAESTRO - Backend (FastAPI)
  # ==========================================================================
  dashboard-backend:
    build:
      context: ./Documentación/dashboard-v2/backend
      network: host
    container_name: quickstay-dashboard-backend
    networks:
      mgmt_net:
        ipv4_address: 172.16.30.40
      dmz_net:
      app_net:
      iot_net:
    env_file:
      - ./secrets.env
    environment:
      - PYTHONUNBUFFERED=1
    dns:
      - ${INFRA_DNS_PRIMARY:-172.16.30.10}
      - ${INFRA_DNS_SECONDARY:-172.16.30.11}
    dns_search:
      - quickstay.local
    volumes:
      - ./Documentación/dashboard-v2/backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs/dashboard:/var/log/dashboard
    restart: unless-stopped

  # ==========================================================================
  # DASHBOARD MAESTRO - Frontend (React + Vite)
  # ==========================================================================
  dashboard-frontend:
    build:
      context: ./Documentación/dashboard-v2/frontend
      network: host
    container_name: quickstay-dashboard-frontend
    networks:
      mgmt_net:
    environment:
      - VITE_API_URL=http://172.16.30.40:8000
    volumes:
      - ./Documentación/dashboard-v2/frontend:/app
      - /app/node_modules
    depends_on:
      - dashboard-backend
    restart: unless-stopped

volumes:
  mysql-data:
  ad-dc-data:
  ad-dc-config:
  zabbix-db-data:
  wazuh-api-config:
  wazuh-etc:
  wazuh-logs:
  wazuh-queue:
  wazuh-var-multigroups:
  wazuh-integrations:
  wazuh-active-response:
  wazuh-agentless:
  wazuh-wodles:
  wazuh-indexer-data:
  mqtt-data:
  grafana-data:
