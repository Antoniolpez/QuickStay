version: '3.8'

services:
  backend:
    build: ./backend
    container_name: quickstay-dashboard-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock  # For container management
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - quickstay-net

  frontend:
    build: ./frontend
    container_name: quickstay-dashboard-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped
    networks:
      - quickstay-net
    depends_on:
      - backend

networks:
  quickstay-net:
    driver: bridge
