#---------------------------------------------------------------------
# QuickStay HAProxy Configuration
# Load Balancer para servidores web redundantes
#---------------------------------------------------------------------

global
    log stdout format raw local0
    maxconn 4096
    user haproxy
    group haproxy
    # daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

#---------------------------------------------------------------------
# Frontend para tráfico HTTP
#---------------------------------------------------------------------
frontend http_front
    bind *:80
    default_backend web_servers
    
    # Headers de seguridad
    http-response set-header X-Frame-Options SAMEORIGIN
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-XSS-Protection "1; mode=block"
    
    # Health check endpoint
    acl is_health path /health
    use_backend health_check if is_health

#---------------------------------------------------------------------
# Frontend para tráfico HTTPS (futuro)
#---------------------------------------------------------------------
frontend https_front
    bind *:443
    mode tcp
    default_backend web_servers

#---------------------------------------------------------------------
# Backend - Servidores Web (Round Robin)
#---------------------------------------------------------------------
backend web_servers
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    
    server web1 172.16.10.20:80 check inter 2000ms rise 2 fall 3
    server web2 172.16.10.21:80 check inter 2000ms rise 2 fall 3

#---------------------------------------------------------------------
# Backend - Health Check
#---------------------------------------------------------------------
backend health_check
    server local 127.0.0.1:8404

#---------------------------------------------------------------------
# Stats/Monitoring Interface
#---------------------------------------------------------------------
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats show-node
    stats show-legends
    stats auth admin:${HAPROXY_STATS_PASSWORD}
