<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Router Dashboard - QuickStay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.1);
        }

        .card h3 {
            font-size: 14px;
            text-transform: uppercase;
            color: #cbd5e1;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .card .big-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .card .subtext {
            font-size: 12px;
            color: #94a3b8;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .table thead {
            background: #0f172a;
        }

        .table th,
        .table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        .table th {
            font-weight: 600;
            color: #cbd5e1;
            font-size: 12px;
            text-transform: uppercase;
        }

        .table tr:hover {
            background: #334155;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge.up {
            background: #10b981;
            color: white;
        }

        .badge.down {
            background: #ef4444;
            color: white;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-top: 40px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #334155;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .error {
            background: #7f1d1d;
            border: 1px solid #ef4444;
            padding: 15px;
            border-radius: 8px;
            color: #fca5a5;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🔧 Router Management Dashboard</h1>
            <p>Monitoreo y control del Firewall/Router QuickStay Infrastructure</p>
        </header>

        <div id="app">
            <div class="loading">Cargando datos del router...</div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        async function fetchAPI(endpoint) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error(`Error fetching ${endpoint}:`, error);
                return null;
            }
        }

        async function loadDashboard() {
            const app = document.getElementById('app');
            
            // Cargar datos en paralelo
            const [dashboard, interfaces, vlans, routes, nftStats] = await Promise.all([
                fetchAPI('/dashboard'),
                fetchAPI('/interfaces'),
                fetchAPI('/vlans'),
                fetchAPI('/routing'),
                fetchAPI('/nftables/stats')
            ]);

            let html = '';

            if (!dashboard) {
                html = '<div class="error">⚠️ Error cargando datos del router. Por favor recarga la página.</div>';
            } else {
                // Stats Cards
                html += `
                    <div class="grid">
                        <div class="card">
                            <h3>Interfaces Activas</h3>
                            <div class="big-number">${interfaces?.interfaces?.filter(i => i.status === 'UP').length || 0}</div>
                            <div class="subtext">de ${interfaces?.interfaces?.length || 0} totales</div>
                        </div>
                        <div class="card">
                            <h3>VLANs Configuradas</h3>
                            <div class="big-number">${vlans?.vlans?.length || 0}</div>
                            <div class="subtext">segmentación de red</div>
                        </div>
                        <div class="card">
                            <h3>Rutas Activas</h3>
                            <div class="big-number">${routes?.routes?.length || 0}</div>
                            <div class="subtext">en tabla de enrutamiento</div>
                        </div>
                        <div class="card">
                            <h3>Reglas Firewall</h3>
                            <div class="big-number">${nftStats?.rules || 0}</div>
                            <div class="subtext">reglas nftables activas</div>
                        </div>
                    </div>
                `;

                // Interfaces
                html += '<h2 class="section-title">📡 Interfaces de Red</h2>';
                if (interfaces?.interfaces?.length > 0) {
                    html += '<table class="table"><thead><tr><th>Interfaz</th><th>Estado</th><th>RX (bytes)</th><th>TX (bytes)</th></tr></thead><tbody>';
                    interfaces.interfaces.forEach(iface => {
                        const status = iface.status === 'UP' ? 
                            '<span class="badge up">UP</span>' : 
                            '<span class="badge down">DOWN</span>';
                        html += `<tr>
                            <td>${iface.name}</td>
                            <td>${status}</td>
                            <td>${(iface.rx_bytes / 1024 / 1024).toFixed(2)} MB</td>
                            <td>${(iface.tx_bytes / 1024 / 1024).toFixed(2)} MB</td>
                        </tr>`;
                    });
                    html += '</tbody></table>';
                }

                // VLANs
                html += '<h2 class="section-title">🌐 VLANs</h2>';
                if (vlans?.vlans?.length > 0) {
                    html += '<table class="table"><thead><tr><th>ID</th><th>Nombre</th></tr></thead><tbody>';
                    vlans.vlans.forEach(vlan => {
                        html += `<tr><td>${vlan.id}</td><td>${vlan.name}</td></tr>`;
                    });
                    html += '</tbody></table>';
                } else {
                    html += '<p>No se encontraron VLANs configuradas</p>';
                }

                // Rutas
                html += '<h2 class="section-title">🛣️ Tabla de Enrutamiento</h2>';
                if (routes?.routes?.length > 0) {
                    html += '<table class="table"><thead><tr><th>Destino</th><th>Gateway</th><th>Métrica</th></tr></thead><tbody>';
                    routes.routes.slice(0, 10).forEach(route => {
                        html += `<tr>
                            <td><code>${route.destination}</code></td>
                            <td>${route.gateway}</td>
                            <td>${route.metric}</td>
                        </tr>`;
                    });
                    html += '</tbody></table>';
                }

                // Info del sistema
                html += '<h2 class="section-title">ℹ️ Información del Sistema</h2>';
                html += `<div class="grid">
                    <div class="card">
                        <h3>Estadísticas NFTables</h3>
                        <p style="margin-top: 10px;">
                            <strong>Tablas:</strong> ${nftStats?.tables || 0}<br>
                            <strong>Chains:</strong> ${nftStats?.chains || 0}<br>
                            <strong>Reglas:</strong> ${nftStats?.rules || 0}
                        </p>
                    </div>
                    <div class="card">
                        <h3>Conexiones Activas</h3>
                        <p style="margin-top: 10px;">
                            <strong>TCP Established:</strong> ${dashboard?.network_stats?.tcp_established || 0}<br>
                            <strong>Conexiones TCP:</strong> ${dashboard?.network_stats?.tcp_connections || 0}<br>
                            <strong>Conexiones UDP:</strong> ${dashboard?.network_stats?.udp_connections || 0}
                        </p>
                    </div>
                </div>`;
            }

            app.innerHTML = html;
        }

        // Cargar dashboard y actualizar cada 10 segundos
        loadDashboard();
        setInterval(loadDashboard, 10000);
    </script>
</body>

</html>
